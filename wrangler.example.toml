# 마이챌린지(마챌) — wrangler CLI 참고용 설정 예시
# ─────────────────────────────────────────────────────────────
# 이 파일은 일부러 wrangler.toml 이 아닌 이름으로 두었습니다.
# 저장소에 wrangler.toml(pages_build_output_dir 포함)이 있으면 Cloudflare Pages가 그 파일을 설정의 기준으로 삼아
# 대시보드에서 연결한 D1 바인딩을 무시하고, 아래 database_id가 비어 있으면 배포가 실패합니다.
# 대시보드로 운영한다면 이 파일은 필요 없습니다.
# wrangler CLI로만 배포하려면 이 파일을 wrangler.toml 로 이름을 바꾸고 database_id를 채우세요.
# ─────────────────────────────────────────────────────────────
name = "machal"
compatibility_date = "2025-10-01"
pages_build_output_dir = "public"

# D1 데이터베이스 바인딩
# Cloudflare 대시보드에서 D1 "machal-db"를 만든 뒤 database_id를 채워 넣으세요.
# (대시보드의 Pages > Settings > Bindings 에서 DB 바인딩을 추가해도 됩니다. 그 경우 이 블록은 참고용입니다.)
[[d1_databases]]
binding = "DB"
database_name = "machal-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
