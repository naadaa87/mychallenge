# 마이챌린지(마챌) — Cloudflare Pages 설정
name = "machal"
compatibility_date = "2025-10-01"
pages_build_output_dir = "public"

# D1 데이터베이스 바인딩
# Cloudflare 대시보드에서 D1 "machal-db"를 만든 뒤 database_id를 채워 넣으세요.
# (대시보드의 Pages > Settings > Bindings 에서 DB 바인딩을 추가해도 됩니다. 그 경우 이 블록은 참고용입니다.)
[[d1_databases]]
binding = "DB"
database_name = "machal-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
